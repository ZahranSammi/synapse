[workspace]
members = [".", "synapse-gui"]
resolver = "2"

[package]
name = "synapse"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
flate2 = "1.1.10"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
xz2 = "0.1.7"
zip = "8.6.0"
